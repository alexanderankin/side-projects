plugins {
    id 'conventions'
}

dependencies {
    annotationProcessor platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
    implementation platform('org.springframework.cloud:spring-cloud-dependencies:2025.1.2')

    implementation platform('io.awspring.cloud:spring-cloud-aws-dependencies:4.1.0')

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
