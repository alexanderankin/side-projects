plugins {
    id 'com.google.cloud.tools.jib'
}

tasks.withType(com.google.cloud.tools.jib.gradle.JibTask).configureEach {
    notCompatibleWithConfigurationCache("https://github.com/GoogleContainerTools/jib/issues/3132")
}

jib {
    from {
        // docker image inspect eclipse-temurin:25-jre-resolute | jq .[0].RepoDigests[] -r
        image = 'eclipse-temurin:25-jre-resolute@sha256:480ef64e4540d45b0301e8afb7873bd3fa61ce93c5f66273eb569420718f38e2'

        platforms {
            platform {
                architecture = 'amd64'
                os = 'linux'
            }
            platform {
                architecture = 'arm64'
                os = 'linux'
            }
        }
    }

    container {
        jvmFlags = [
                // Disable accelerated Base64 encoding/decoding: CVE-2026-114938
                '-XX:-UseBASE64Intrinsics',

                // Require TLS 1.3 by default; peers must support it. Applications can
                // override JSSE defaults by explicitly configuring their SSL contexts.
                '-Djdk.tls.client.protocols=TLSv1.3',
                '-Djdk.tls.server.protocols=TLSv1.3',
                '-Dhttps.protocols=TLSv1.3',
                // '-Djdk.tls.rejectClientInitiatedRenegotiation=true', // not for TLS<v1.3
                // '-Djdk.tls.namedGroups=X25519MLKEM768',

                // lock down jdk (jmx, jndi, etc)
                '-Dcom.sun.management.jmxremote.authenticate=true',
                '-Dcom.sun.management.jmxremote.ssl=true',
                '-Dcom.sun.management.jmxremote.local.only=true',
                '-Dcom.sun.management.jmxremote.registry.ssl=true',
                '-Dcom.sun.management.jmxremote.ssl.need.client.auth=true',
                '-Dcom.sun.jndi.ldap.object.trustSerialData=false',
                '-Djdk.jndi.object.factoriesFilter=!*',
                '-XX:+DisableAttachMechanism',

                // Request stapled OCSP responses alongside the existing revocation checks.
                '-Djdk.tls.client.enableStatusRequestExtension=true',
                '-Dcom.sun.net.ssl.checkRevocation=true',
                '-Dcom.sun.security.enableCRLDP=true',
        ]
        // JAVA_TOOL_OPTIONS="-Xmx512m"
        // environment = ['JAVA_TOOL_OPTIONS': '-Xmx512m']
        // user =  '10001:10001'
    }
}
