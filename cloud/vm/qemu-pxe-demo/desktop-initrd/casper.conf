# This is the stock Ubuntu Desktop casper configuration with NFSv3/TCP options added.
export USERNAME="ubuntu"
export USERFULLNAME="Live session user"
export HOST="ubuntu"
export BUILD_SYSTEM="Ubuntu"
# Keep individual RPC reads small when passing NFS through QEMU guestfwd.
export NFSOPTS="vers=3,tcp,rsize=16384,wsize=16384"
