# Install as /etc/dnsmasq.d/pxe.conf after adapting these example values.
# PXE server: 192.168.50.2/24; router/DNS: 192.168.50.1.
# This must be the only DHCP address allocator on this LAN/VLAN.
port=0
listen-address=192.168.50.2
bind-interfaces
dhcp-authoritative
dhcp-range=192.168.50.3,192.168.50.199,255.255.255.0,12h
dhcp-option=option:router,192.168.50.1
dhcp-option=option:dns-server,192.168.50.1
log-dhcp

enable-tftp
tftp-root=/srv/pxe
# Bound transfer ports make firewall rules predictable.
tftp-port-range=50000,50100

# Firmware loads iPXE over TFTP. iPXE loads the menu rather than itself.
# make ipxe builds ipxe.pxe for legacy BIOS and ipxe.efi for x86-64 UEFI.
dhcp-userclass=set:ipxe,iPXE
dhcp-match=set:bios,option:client-arch,0
dhcp-match=set:efi64,option:client-arch,7
dhcp-match=set:efi64,option:client-arch,9
dhcp-boot=tag:!ipxe,tag:bios,ipxe.pxe,,192.168.50.2
dhcp-boot=tag:!ipxe,tag:efi64,ipxe.efi,,192.168.50.2
dhcp-boot=tag:ipxe,autoexec.ipxe,,192.168.50.2
