// file:noinspection VulnerableLibrariesLocal

import java.nio.file.Files
import java.nio.file.StandardCopyOption

plugins {
    id 'java'
    id 'application'
    id 'org.springframework.boot' version '4.1.2'
    id 'com.gradleup.shadow' version '9.6.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

application.mainClass = 'org.example.ExampleApplication'
springBoot.mainClass = application.mainClass

boolean creatingCache = Boolean.parseBoolean(
    providers.systemProperty('creatingCache')
        .orElse(providers.gradleProperty('creatingCache'))
        .getOrElse('true')
)

if (creatingCache) {
    repositories.mavenCentral()
} else {
    repositories.mavenLocal()
}

dependencies {
    annotationProcessor platform('org.springframework.boot:spring-boot-dependencies:4.1.2')
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.2')
    implementation platform('org.springframework.cloud:spring-cloud-dependencies:2025.1.4')

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    implementation 'info.picocli:picocli:4.7.7'
    implementation 'info.picocli:picocli-codegen:4.7.7'

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.springframework.boot:spring-boot-starter-aspectj'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'

    implementation 'org.springframework.boot:spring-boot-micrometer-tracing-brave'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.xerial:sqlite-jdbc:3.53.4.0'
    implementation 'org.postgresql:postgresql'
    implementation 'org.liquibase:liquibase-core'

    implementation 'com.fasterxml.uuid:java-uuid-generator:5.2.0'
    implementation 'org.hibernate.orm:hibernate-core'
    implementation 'org.hibernate.orm:hibernate-community-dialects'
    implementation 'org.komamitsu:spring-data-sqlite:1.4.0'

    // commons
    implementation 'commons-codec:commons-codec:1.23.0'
    implementation 'commons-io:commons-io:2.22.0'
    implementation 'commons-net:commons-net:3.13.0'
    implementation 'org.apache.commons:commons-compress:1.28.0'
    implementation 'org.apache.commons:commons-collections4:4.6.0'
    implementation 'org.apache.commons:commons-csv:1.14.1'
    implementation 'org.apache.commons:commons-lang3:3.21.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-amqp-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jdbc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-rabbitmq'
    testImplementation 'org.hamcrest:hamcrest:2.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

}

if (creatingCache) {
    tasks.register('goOfflineMavenLocal') {
        group = 'build setup'
        description = 'Resolve dependencies and populate ~/.m2/repository for offline mavenLocal() builds'

        def m2 = file(
            providers.systemProperty('maven.repo.local')
                .orElse(providers.gradleProperty('maven.repo.local'))
                .getOrElse(new File(System.getProperty('user.home'), '.m2/repository').path)
        )

        doLast {
            // Plugin DSL markers and implementations live on the buildscript
            // classpath, not on the application's runtimeClasspath.
            [
                [configurations: project.configurations, dependencies: project.dependencies],
                [configurations: project.buildscript.configurations, dependencies: project.buildscript.dependencies]
            ].each { scope ->
                def components = [] as Set
                scope.configurations.toList().findAll { it.canBeResolved }.each { configuration ->
                    logger.lifecycle('Resolving {}...', configuration.name)
                    configuration.resolve()
                    configuration.incoming.resolutionResult.allComponents.each { component ->
                        if (component.id instanceof ModuleComponentIdentifier) {
                            components.add(component.id)
                        }
                    }
                }
                if (!components.empty) {
                    // A module resolved through Gradle metadata may not yet have
                    // its POM downloaded. Maven local needs that POM too.
                    def result = scope.dependencies.createArtifactResolutionQuery()
                        .forComponents(components)
                        .withArtifacts(MavenModule, MavenPomArtifact)
                        .execute()
                    result.resolvedComponents.each { component ->
                        component.getArtifacts(MavenPomArtifact).each { artifact ->
                            if (artifact instanceof UnresolvedArtifactResult) {
                                throw new GradleException("Cannot export POM for ${component.id}", artifact.failure)
                            }
                        }
                    }
                }
            }

            // Parent POMs, imported BOMs and plugin markers are not necessarily
            // graph components. Mirror the downloaded module files as well, in
            // Maven layout, including .module metadata and classifier artifacts.
            // Use a dedicated GRADLE_USER_HOME to avoid exporting unrelated files.
            def moduleCache = new File(gradle.gradleUserHomeDir, 'caches/modules-2/files-2.1')
            int exported = 0
            fileTree(moduleCache).files.sort().each { artifact ->
                def parts = moduleCache.toPath().relativize(artifact.toPath()).collect { it.toString() }
                if (parts.size() != 5) {
                    throw new GradleException("Unexpected Gradle module cache path: ${artifact}")
                }
                def target = new File(m2, "${parts[0].replace('.', '/')}/${parts[1]}/${parts[2]}/${parts[4]}")
                target.parentFile.mkdirs()
                Files.copy(artifact.toPath(), target.toPath(), StandardCopyOption.REPLACE_EXISTING)
                exported++
            }
            if (exported == 0) {
                throw new GradleException("No module artifacts found in ${moduleCache}")
            }
            logger.lifecycle('Exported {} module files (including plugin metadata) to {}', exported, m2)
        }
    }


    tasks.register('goOffline') {
        group = 'build setup'

        doLast {
            configurations
                .toList()
                .findAll { it.canBeResolved }
                .each {
                    println "Resolving ${it.name}"
                    it.resolve()
                }
        }
    }
}
