[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qemu-offline-packaging"
version = "0.1.0"
description = "QEMU integration tests for offline Gradle packaging"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.15"]

[project.scripts]
qemu-offline-test = "qemu_offline.runner:main"

[tool.setuptools.package-data]
qemu_offline = ["guest.sh", "verify.gradle"]

[tool.pytest.ini_options]
testpaths = ["test"]
#addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "test"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "BLE", "EXE"]
