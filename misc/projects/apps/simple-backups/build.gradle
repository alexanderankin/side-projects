plugins {
    id 'spring-conventions'
    id 'picocli-conventions'
}

application.mainClass = 'info.ankin.simplebackups.SimpleBackups'

dependencies {
    implementation 'org.springframework:spring-core'
    implementation 'org.springframework.boot:spring-boot-starter-logging'
    implementation 'tools.jackson.core:jackson-databind'
    implementation 'org.apache.commons:commons-compress:1.28.0'
    implementation 'com.github.luben:zstd-jni:1.5.7-24'
    implementation 'com.github.mwiede:jsch:2.27.7'
    implementation 'info.ankin.projects:exec:0.0.2'
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:sso'
    implementation 'software.amazon.awssdk:ssooidc'
    implementation 'software.amazon.awssdk:sts'

    itestImplementation 'org.testcontainers:testcontainers'
    itestImplementation 'io.floci:testcontainers-floci:2.0.0'
    itestImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
    itestImplementation 'com.github.robtimus:sftp-fs:4.0.3'
}
